events {
  worker_connections 1024;
}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  
  server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Handle React Client-Side Routing
    location / {
      try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API calls to your new Oracle backend
    # Replace the proxy_pass URL with your backend's actual address and port
    location /chat_compare {
      proxy_pass http://127.0.0.1:8080;
    }

    location /tts {
      proxy_pass http://127.0.0.1:8080;
    }

    location /health {
      proxy_pass http://127.0.0.1:8080;
    }
  }
}